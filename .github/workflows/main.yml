
name: Compilar PS4toXboxMapper APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Instalar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Descomprimir proyecto
        run: |
          set -e

          ZIP="PS4toXboxMapper-proyecto.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: No se encuentra $ZIP"
            ls -la
            exit 1
          fi

          unzip -q "$ZIP" -d extraido

          SETTINGS=$(find extraido \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle"
            find extraido -maxdepth 4 -type f | head -100
            exit 1
          fi

          P=$(dirname "$SETTINGS")
          echo "P=$P" >> "$GITHUB_ENV"

          echo "Proyecto encontrado: $P"
          ls -la "$P"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        working-directory: ${{ env.P }}
        run: |
          set -e

          if [ -f gradlew ]; then
            sed -i 's/\r$//' gradlew
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "ERROR: El proyecto no incluye gradlew."
            exit 1
          fi

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: PS4toXboxMapper-APK
          path: ${{ env.P }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
